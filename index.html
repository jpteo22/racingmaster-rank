<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>레이싱마스터 랭킹 뷰어</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b12;
      --panel: #0e1624;
      --panel-hover: #141f32;
      --text: #f1f5f9;
      --muted: #8b9bb4;
      --line: #1e293b;
      --line-strong: #334155;
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.35);
      --green: #22c55e;
      --green-glow: rgba(34, 197, 94, 0.4);
      --gold: #fbbf24;
      --silver: #94a3b8;
      --bronze: #fb923c;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
      letter-spacing: -0.2px;
    }

    button { font: inherit; cursor: pointer; }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--line);
      background: rgba(7, 11, 18, 0.88);
      backdrop-filter: blur(12px);
    }

    .header-inner {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(160px, 1fr) auto minmax(160px, 1fr);
      gap: 16px;
      align-items: center;
      padding: 14px 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(16px, 2.2vw, 22px);
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #e2e8f0;
      text-transform: uppercase;
    }

    .tabs,
    .state-tabs {
      display: inline-grid;
      grid-auto-flow: column;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .tabs { justify-self: center; }

    .tab,
    .state-tab {
      min-height: 44px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      padding: 0 26px;
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .tab[aria-selected="true"],
    .state-tab[aria-selected="true"] {
      background: var(--accent);
      color: #080c14;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    main {
      width: min(1200px, calc(100% - 32px));
      margin: 24px auto 50px;
    }

    .state-row {
      display: grid;
      place-items: center;
      margin-bottom: 20px;
    }

    .state-tabs {
      min-width: min(260px, 100%);
    }

    .metric-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .metric {
      min-height: 76px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 12px 14px;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .metric strong {
      display: block;
      margin-top: 4px;
      font-size: 18px;
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .car-card {
      display: flex;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 16px;
      gap: 16px;
      box-shadow: var(--shadow);
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .car-card:hover {
      border-color: var(--line-strong);
      background: var(--panel-hover);
    }

    .block-info {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1.2;
      min-width: 280px;
    }

    .rank-badge {
      display: inline-grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--line);
      color: var(--text);
      font-weight: 900;
      font-size: 15px;
      flex-shrink: 0;
    }

    .rank-1 { background: rgba(251, 191, 36, 0.15); color: var(--gold); border: 1px solid rgba(251, 191, 36, 0.4); }
    .rank-2 { background: rgba(148, 163, 184, 0.15); color: var(--silver); border: 1px solid rgba(148, 163, 184, 0.4); }
    .rank-3 { background: rgba(251, 146, 60, 0.15); color: var(--bronze); border: 1px solid rgba(251, 146, 60, 0.4); }

    .car-image {
      width: 76px;
      aspect-ratio: 16 / 10;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #05070c;
      display: grid;
      place-items: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .car-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .car-meta {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .car-name {
      margin: 0;
      font-weight: 900;
      font-size: 15px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .car-tuning {
      margin: 0;
      font-size: 12px;
      font-weight: 800;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .block-tracks {
      display: flex;
      gap: 12px;
      flex: 1.6;
    }

    .track-group {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .track-cell {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
    }

    .track-name {
      font-size: 10.5px;
      font-weight: 800;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-time {
      font-size: 13.5px;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
    }

    .track-cell.best-record .track-time {
      color: var(--green);
      text-shadow: 0 0 10px var(--green-glow);
    }

    .empty {
      padding: 50px 16px;
      color: var(--muted);
      text-align: center;
      font-weight: 800;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    @media (max-width: 960px) {
      .car-card {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
        padding: 14px;
      }
      .block-info {
        width: 100%;
        min-width: 0;
      }
      .block-tracks {
        flex-direction: column;
        gap: 8px;
      }
      .track-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 640px) {
      .header-inner,
      main { width: min(100% - 20px, 1200px); }
      .metric-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .state-tabs { width: 100%; grid-auto-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <h1>레이싱마스터 랭킹</h1>
      </div>
      <nav class="tabs" aria-label="차량 클래스">
        <button class="tab" data-class="standard" aria-selected="true">스탠다드</button>
        <button class="tab" data-class="performance" aria-selected="false">퍼포먼스</button>
        <button class="tab" data-class="extreme" aria-selected="false">익스트림</button>
      </nav>
      <div></div>
    </div>
  </header>

  <main>
    <section class="state-row">
      <div class="state-tabs" aria-label="돌파 상태">
        <button class="state-tab" data-state="base" aria-selected="true">ECU 0</button>
        <button class="state-tab" data-state="full" aria-selected="false">ECU 5</button>
      </div>
    </section>

    <section class="metric-strip" id="metrics" aria-label="최고 기록"></section>

    <div class="card-list" id="cardList"></div>
  </main>

  <script>
    const state = { class: "standard", breakthrough: "base", data: null };
    const els = {
      classTabs: document.querySelectorAll(".tab"),
      stateTabs: document.querySelectorAll(".state-tab"),
      cardList: document.getElementById("cardList"),
      metrics: document.getElementById("metrics")
    };

    init();

    async function init() {
      bindEvents();
      try {
        const response = await fetch("racingmaster-data.json", { cache: "no-store" });
        if (!response.ok) throw new Error("data file missing");
        state.data = await response.json();
      } catch {
        state.data = { tracks: [], cars: [] };
        els.cardList.innerHTML = `<div class="empty">racingmaster-data.json 파일을 같은 폴더에 올려주세요.</div>`;
        return;
      }
      render();
    }

    function bindEvents() {
      els.classTabs.forEach((button) => {
        button.addEventListener("click", () => {
          state.class = button.dataset.class;
          render();
        });
      });
      els.stateTabs.forEach((button) => {
        button.addEventListener("click", () => {
          state.breakthrough = button.dataset.state;
          render();
        });
      });
    }

    function render() {
      syncTabs();
      const ranked = getRankedCars();
      renderMetrics(ranked);
      renderCards(ranked);
    }

    function syncTabs() {
      els.classTabs.forEach((button) => button.setAttribute("aria-selected", String(button.dataset.class === state.class)));
      els.stateTabs.forEach((button) => button.setAttribute("aria-selected", String(button.dataset.state === state.breakthrough)));
    }

    function getRankedCars() {
      const cars = state.data.cars.filter((car) => car.class === state.class);
      if (!cars.length) return [];
      const bestRecords = getBestRecords(cars);
      return cars
        .map((car) => ({ ...car, score: calculateScore(car, bestRecords) }))
        .sort((a, b) => a.score.totalGap - b.score.totalGap || a.name.localeCompare(b.name, "ko"));
    }

    function getBestRecords(cars) {
      return state.data.tracks.reduce((acc, track) => {
        acc[track.id] = Math.min(...cars.map((car) => car.records[state.breakthrough][track.id]));
        return acc;
      }, {});
    }

    function calculateScore(car, bestRecords) {
      const totalGap = state.data.tracks.reduce((sum, track) => {
        const record = car.records[state.breakthrough][track.id];
        return sum + ((record - bestRecords[track.id]) / bestRecords[track.id]) * 100;
      }, 0);
      return { totalGap };
    }

    function renderMetrics(cars) {
      if (!cars.length) {
        els.metrics.innerHTML = "";
        return;
      }
      const best = getBestRecords(cars);
      els.metrics.innerHTML = state.data.tracks.map((track) => {
        const bestCar = cars.find((car) => car.records[state.breakthrough][track.id] === best[track.id]);
        return `
          <article class="metric">
            <span>${escapeHtml(track.name)}</span>
            <strong>${formatTime(best[track.id])}</strong>
            <span>${bestCar ? escapeHtml(bestCar.name) : ""}</span>
          </article>
        `;
      }).join("");
    }

    function renderCards(cars) {
      if (!cars.length) {
        els.cardList.innerHTML = `<div class="empty">표시할 차량이 없습니다.</div>`;
        return;
      }
      
      const best = getBestRecords(cars);
      const tracks = state.data.tracks;

      els.cardList.innerHTML = cars.map((car, index) => {
        const rank = index + 1;
        const rankClass = rank <= 3 ? `rank-${rank}` : "";
        const tuningVal = car.tuning ? escapeHtml(car.tuning) : "00000";

        const trackGroups = [];
        for (let i = 0; i < tracks.length; i += 2) {
          trackGroups.push(tracks.slice(i, i + 2));
        }

        const trackBlocksHtml = trackGroups.map((group) => `
          <div class="track-group">
            ${group.map((track) => {
              const recordMs = car.records[state.breakthrough][track.id];
              const isBest = recordMs === best[track.id];
              let trackDisplayName = track.name;
              if (trackDisplayName.includes("인디애나폴리스")) {
                trackDisplayName = trackDisplayName.replace("인디애나폴리스", "인디애나");
              }
              return `
                <div class="track-cell ${isBest ? 'best-record' : ''}">
                  <span class="track-name" title="${escapeHtml(track.name)}">${escapeHtml(trackDisplayName)}</span>
                  <span class="track-time">${formatTime(recordMs)}</span>
                </div>
              `;
            }).join("")}
          </div>
        `).join("");

        return `
          <article class="car-card">
            <div class="block-info">
              <span class="rank-badge ${rankClass}">${rank}</span>
              <div class="car-image">
                ${imageSrc(car) ? `<img src="${escapeHtml(imageSrc(car))}" alt="${escapeHtml(car.name)}">` : `<span aria-hidden="true"></span>`}
              </div>
              <div class="car-meta">
                <p class="car-name" title="${escapeHtml(car.name)}">${escapeHtml(car.name)}</p>
                <p class="car-tuning">튜닝: ${tuningVal}</p>
              </div>
            </div>
            <div class="block-tracks">
              ${trackBlocksHtml}
            </div>
          </article>
        `;
      }).join("");
    }

    function formatTime(ms) {
      const minutes = Math.floor(ms / 60000);
      const seconds = Math.floor((ms % 60000) / 1000);
      const milliseconds = ms % 1000;
      return `${minutes}:${String(seconds).padStart(2, "0")}.${String(milliseconds).padStart(3, "0")}`;
    }

    function imageSrc(car) {
      if (car.imageName) return `images/${car.class}/${car.imageName}`;
      if (car.imageUrl) return car.imageUrl;
      return "";
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
